<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Письмо для тебя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e2633 0%, #17141d 100%);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Оболочка конверта */
    .envelope-box {
      width: 320px;
      height: 220px;
      background: #dfcfbe;
      border-radius: 8px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-title {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      color: #5a4634;
      margin-bottom: 20px;
    }

    /* Сургучная печать */
    .wax-seal {
      width: 60px;
      height: 60px;
      background: #8b1e1e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3), inset 0 0 8px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
      user-select: none;
    }
    .wax-seal:hover { transform: scale(1.08); }

    /* Лист письма */
    .letter-sheet {
      display: none;
      background: #faf6f0;
      width: 100%;
      max-width: 480px;
      padding: 35px 25px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      font-family: 'Caveat', cursive;
      color: #2b2520;
      animation: unfold 0.8s ease forwards;
    }

    .letter-sheet h2 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .letter-sheet p {
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }
    .letter-sheet p:nth-child(2) { animation-delay: 0.3s; }
    .letter-sheet p:nth-child(3) { animation-delay: 0.8s; }

    /* Полароид фото */
    .polaroid {
      background: #fff;
      padding: 10px 10px 25px 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transform: rotate(-2deg);
      margin: 25px auto;
      max-width: 260px;
      text-align: center;
    }
    .polaroid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .polaroid span {
      display: block;
      margin-top: 10px;
      font-size: 20px;
      color: #666;
    }

    @keyframes unfold {
      from { opacity: 0; transform: scale(0.85) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Экран 1: Конверт -->
  <div class="envelope-box" id="envelope">
    <div class="envelope-title">Для тебя ✨</div>
    <div class="wax-seal">💌</div>
  </div>

  <!-- Экран 2: Письмо -->
  <div class="letter-sheet" id="letter">
    <h2>Привет!</h2>
    <p>Я просто хотел напомнить, насколько ты важный и дорогой для меня человек.</p>
    <p>Спасибо за каждый момент, улыбку и тепло, которые ты даришь.</p>

    <div class="polaroid">
      <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500" alt="Фото">
      <span>наша история</span>
    </div>

    <p style="text-align: right; margin-top: 20px;">С любовью ❤️</p>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');

    envelope.addEventListener('click', () => {
      // Тактильный виброотклик (для смартфонов)
      if (navigator.vibrate) navigator.vibrate([50, 40, 50]);

      // Скрываем конверт и показываем письмо
      envelope.style.display = 'none';
      letter.style.display = 'block';
    });
  </script>
</body>
</html>
